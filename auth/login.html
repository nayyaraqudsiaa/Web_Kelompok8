<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Login</h2>
    
    <div class="form-group">
        <label for="loginName">Nama Pengguna</label>
        <input type="text" id="loginName" placeholder="Masukkan nama Anda">
    </div>
    
    <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Masukkan password">
    </div>
    
    <button onclick="login()">Masuk</button>
    
    <div class="link-text">
        Belum punya akun? <a href="register.html">Daftar di sini</a>
    </div>
</div>

<script>
    function login() {
        const loginName = document.getElementById('loginName').value.trim();
        const loginPassword = document.getElementById('loginPassword').value;

        if (loginName === "" || loginPassword === "") {
            alert("Error: Semua kolom harus diisi!");
            return;
        }

        // ambil data dari localstorage <--- biar tidak lupa (jan dihapus)
        const storedData = localStorage.getItem('userData');
        if (!storedData) {
            alert("Error: Anda belum terdaftar! Silakan daftar terlebih dahulu.");
            return;
        }

        // cek data login, cocok apa tidak <--- biar tidak lupa (jan di hapus)
        const userData = JSON.parse(storedData);
        if (loginName === userData.name && loginPassword === userData.password) {
            alert("Success: Login berhasil! Selamat datang, " + userData.name);
        } else {
            alert("Error: Nama atau Password salah!");
        }
    }
</script>
<!-- test commit -->
</body>
</html>
