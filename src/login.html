<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Tailwind -->
    <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">

    <h2 class="text-2xl font-bold text-center mb-6">Login</h2>

    <form onsubmit="login(event)">

        <div class="mb-4">
            <label for="loginName" class="block mb-2 font-medium">
                Nama Pengguna
            </label>
            <input 
                type="text" 
                id="loginName"
                placeholder="Masukkan nama Anda"
                class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                required
            >
        </div>

        <div class="mb-6">
            <label for="loginPassword" class="block mb-2 font-medium">
                Password
            </label>
            <input 
                type="password" 
                id="loginPassword"
                placeholder="Masukkan password"
                class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                required
            >
        </div>

        <button 
            type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition"
        >
            Masuk
        </button>

    </form>

    <div class="text-center mt-4 text-sm">
        Belum punya akun?
        <a href="register.html" class="text-blue-600 hover:underline">
            Daftar di sini
        </a>
    </div>

</div>

<script>

function setCookie(name, value, days) {
    let expires = "";
    if (days) {
        const date = new Date();
        date.setTime(date.getTime() + (days*24*60*60*1000));
        expires = "; expires=" + date.toUTCString();
    }
    document.cookie = name + "=" + value + expires + "; path=/";
}

function getCookie(name) {
    const nameEQ = name + "=";
    const ca = document.cookie.split(';');
    for(let i=0;i < ca.length;i++) {
        let c = ca[i];
        while (c.charAt(0)==' ') c = c.substring(1);
        if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length);
    }
    return null;
}

function login(event) {

    event.preventDefault();

    const loginName = document.getElementById('loginName').value.trim();
    const loginPassword = document.getElementById('loginPassword').value;

    if (loginName === "" || loginPassword === "") {
        alert("Error: Semua kolom harus diisi!");
        return;
    }

    const storedData = localStorage.getItem('userData');

    if (!storedData) {
        alert("Error: Anda belum terdaftar! Silakan daftar terlebih dahulu.");
        return;
    }

    const userData = JSON.parse(storedData);

    if (loginName === userData.name && loginPassword === userData.password) {
        //simpan cookie (1 hari)
        setCookie("username", userData.name, 1)
        alert("Success: Login berhasil! Selamat datang, " + userData.name);
        window.location.href = "dashboard.html";

    } else {
        alert("Error: Nama atau Password salah!");
    }
}
</script>

</body>
</html>
