<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6">Daftar Akun</h2>

        <form onsubmit="register(); return false;">
            
            <div class="mb-4">
                <label for="regName" class="block mb-2 font-medium">Nama Lengkap</label>
                <input type="text" id="regName"
                    class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Hanya huruf dan spasi" required>
            </div>

            <div class="mb-4">
                <label for="regEmail" class="block mb-2 font-medium">Email</label>
                <input type="email" id="regEmail"
                    class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Masukkan email" required>
            </div>

            <div class="mb-4">
                <label class="block mb-2 font-medium">Jenis Kelamin</label>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2">
                        <input type="radio" name="gender" value="Laki-laki" required>
                        Laki-laki
                    </label>

                    <label class="flex items-center gap-2">
                        <input type="radio" name="gender" value="Perempuan">
                        Perempuan
                    </label>
                </div>
            </div>

            <div class="mb-4">
                <label for="regPassword" class="block mb-2 font-medium">Password</label>
                <input type="password" id="regPassword"
                    class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Buat password" required>
            </div>

            <div class="mb-6">
                <label for="regKonfirmasiPassword" class="block mb-2 font-medium">Konfirmasi Password</label>
                <input type="password" id="regKonfirmasiPassword"
                    class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Ulangi password" required>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-200">
                Daftar
            </button>

            <div class="text-center mt-4 text-sm">
                Sudah punya akun?
                <a href="login.html" class="text-blue-600 hover:underline">
                    Login di sini
                </a>
            </div>

        </form>
    </div>

    <script>
    function register() {
        const nameInput = document.getElementById('regName').value.trim();
        const emailInput = document.getElementById('regEmail').value.trim();
        const genderInput = document.querySelector('input[name="gender"]:checked');
        const passwordInput = document.getElementById('regPassword').value;
        const confirmInput = document.getElementById('regKonfirmasiPassword').value;

        if (nameInput === "" || emailInput === "" || genderInput === "" || passwordInput === "" || !confirmInput) {
            alert("Error: Semua kolom harus diisi!");
            return;
        }

        const nameRegex = /^[a-zA-Z\s]+$/;
        if (!nameRegex.test(nameInput)) {
            alert("Nama hanya bisa berisi huruf dan spasi!");
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(emailInput)) {
            alert("Format email tidak valid!");
            return;
        }

        const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;
        if (!passwordRegex.test(passwordInput)) {
            alert("Password minimal 8 karakter dan harus mengandung huruf dan angka!");
            return;
        }

        if (passwordInput !== confirmInput) {
            alert("Password dan Konfirmasi Password tidak sesuai!");
            return;
        }

        // simpan data ke localstorage <--- biar tidak lupa (jan di hapus)
        const userData = {
            name: nameInput,
            email: emailInput,
            gender: genderInput,
            password: passwordInput
        };

        localStorage.setItem('userData', JSON.stringify(userData));
        alert("Sukses: Pendaftaran berhasil!");
        
        window.location.href = "login.html";
    }
</script>

</body>
</html>
